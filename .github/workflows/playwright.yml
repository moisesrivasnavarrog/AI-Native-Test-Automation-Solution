# Runs the starter/ Playwright project on every push to main and on
# every PR so the recovery path itself stays green — and so students
# who publish this repository see a real "Playwright Tests" run in
# their Actions tab. See docs/ci-quality-gates.md for the quality
# gates, artifacts, and how to mark this check as required.
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: starter/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - run: npx playwright install --with-deps

      # API suite (DummyJSON): request-context only, one project is
      # enough — it does not exercise a browser.
      - name: API tests
        run: npx playwright test tests/api --project=chromium
        env:
          PW_OBSERVABILITY_JSON: observability/last-run/api-results.json

      # Observability pipeline unit tests (pure logic — one project is
      # enough). Gate on them like any other suite: an observability bug
      # must fail the check, not be hidden.
      - name: Observability unit tests
        run: npx playwright test tests/observability --project=chromium
        env:
          PW_OBSERVABILITY_JSON: observability/last-run/unit-results.json

      # UI suite (SauceDemo + scaffold example) across all browsers.
      - name: UI tests
        run: npx playwright test tests/saucedemo.spec.ts tests/example.spec.ts
        env:
          PW_OBSERVABILITY_JSON: observability/last-run/ui-results.json

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: starter/playwright-report/
          retention-days: 30

      # Structured JSON results for the observability pipeline —
      # uploaded on success and failure alike so green runs also leave
      # evidence. Only *.json land in observability/last-run/.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: observability-results
          path: starter/observability/last-run/
          retention-days: 30
          if-no-files-found: ignore

      # Traces and screenshots land in test-results/ — keep them only
      # when something failed so the evidence is downloadable.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: starter/test-results/
          retention-days: 7
